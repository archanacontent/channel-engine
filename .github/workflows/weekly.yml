name: Make Shorts

# Every morning, just after the free AI quotas reset, write and render every
# empty slot in the next 8 days for every channel, store them, upload YouTube
# Shorts as private and update the review issue for their week. One job does it
# all so setup runs once (this repo is private and has 2,000 free minutes a month).
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First day to fill (YYYY-MM-DD). Empty = tomorrow."
        required: false
      days:
        description: "How many days"
        required: false
        default: "8"
      slugs:
        description: "Channels (space separated). Empty = all."
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: shorts-state
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install tools
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r requirements.txt playwright
      - uses: actions/cache@v4
        with: { path: ~/.cache/kokoro, key: kokoro-v1.0 }
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: playwright-chromium-v1 }
      - run: bash scripts/setup_models.sh && python -m playwright install --with-deps chromium
      - name: Write and render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          start="${{ github.event.inputs.start }}"; [ -z "$start" ] && start=$(date -u -d tomorrow +%F)
          days="${{ github.event.inputs.days }}"; [ -z "$days" ] && days=8
          slugs="${{ github.event.inputs.slugs }}"
          [ -z "$slugs" ] && slugs="comicsofy asked-and-answered automation-shelf breach-brief plain-docs deep-field"
          for s in $slugs; do
            echo "::group::$s"
            timeout 1500 python -u -m pipeline.week --slug $s --start $start --days $days --out collected || echo "$s stopped early"
            echo "::endgroup::"
          done
      - name: Store, upload private, update review issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_ASKED_AND_ANSWERED: ${{ secrets.YT_REFRESH_ASKED_AND_ANSWERED }}
          YT_REFRESH_AUTOMATION_SHELF: ${{ secrets.YT_REFRESH_AUTOMATION_SHELF }}
          YT_REFRESH_BREACH_BRIEF: ${{ secrets.YT_REFRESH_BREACH_BRIEF }}
          YT_REFRESH_PLAIN_DOCS: ${{ secrets.YT_REFRESH_PLAIN_DOCS }}
          YT_REFRESH_DEEP_FIELD: ${{ secrets.YT_REFRESH_DEEP_FIELD }}
        run: python -m pipeline.upload --collect collected --release shorts-${{ github.run_id }}
      - name: Save queue and scripts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue state channels/*/episodes
          git diff --cached --quiet || git commit -m "Queue new Shorts"
          git pull --rebase -q && git push
      - name: Report problems
        if: always()
        run: cat collected/*/failures.txt 2>/dev/null || true
