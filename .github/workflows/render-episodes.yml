name: Render episodes

# Renders every episode file changed in a push, or all of them on demand.
on:
  workflow_dispatch:
  push:
    paths: ["channels/**/episodes/*.yaml"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      - run: bash scripts/setup_models.sh
      - name: Render
        run: |
          for f in channels/*/episodes/*.yaml; do python -m render.build "$f" --out out; done
      - uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: out/**/*.mp4
          retention-days: 3
