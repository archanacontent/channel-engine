name: Instagram post now

# Run by hand: posts one file from a branch to Instagram immediately.
on:
  workflow_dispatch:
    inputs:
      ref: { description: "Branch holding the file and caption", required: true }
      file: { description: "File path in that branch", required: true }
      caption: { description: "Caption file path in that branch", required: true }

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}", path: drop }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_ID: ${{ secrets.IG_PAGE_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: python -m publish.instagram post "drop/${{ inputs.file }}" "drop/${{ inputs.caption }}"
      - name: Save the posted ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/instagram_posted.json
          git diff --cached --quiet || git commit -m "Instagram ledger"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
