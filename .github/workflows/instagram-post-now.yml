name: Instagram post now

# Run by hand: posts one file from a branch to Instagram immediately.
on:
  workflow_dispatch:
    inputs:
      ref: { description: "Branch holding the file and caption", required: true }
      file: { description: "File path in that branch", required: true }
      caption: { description: "Caption file path in that branch", required: true }

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}", path: drop }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_ID: ${{ secrets.IG_PAGE_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: python -m publish.instagram post "drop/${{ inputs.file }}" "drop/${{ inputs.caption }}"
