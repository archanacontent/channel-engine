name: Post slot

# Publishes ticked posts whose slot has passed. Runs a few minutes after each
# slot (09:00, 13:00, 18:00 US Eastern; times are UTC for EST, an hour late in
# summer time). Kept to three runs a day to save free Actions minutes.
on:
  schedule:
    - cron: "5 14,18,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: shorts-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q google-api-python-client google-auth pyyaml
      - name: Publish approved Shorts that are due
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_ASKED_AND_ANSWERED: ${{ secrets.YT_REFRESH_ASKED_AND_ANSWERED }}
          YT_REFRESH_AUTOMATION_SHELF: ${{ secrets.YT_REFRESH_AUTOMATION_SHELF }}
          YT_REFRESH_BREACH_BRIEF: ${{ secrets.YT_REFRESH_BREACH_BRIEF }}
          YT_REFRESH_PLAIN_DOCS: ${{ secrets.YT_REFRESH_PLAIN_DOCS }}
          YT_REFRESH_DEEP_FIELD: ${{ secrets.YT_REFRESH_DEEP_FIELD }}
          YT_REFRESH_DREAM_COMICS: ${{ secrets.YT_REFRESH_DREAM_COMICS }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_ID: ${{ secrets.IG_PAGE_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: python -m review.slot_check
      - name: Save queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || git commit -m "Published Shorts"
          git pull --rebase -q && git push
