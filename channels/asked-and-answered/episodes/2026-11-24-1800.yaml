description:
  hook: Early U.S. performance metrics show ChatGPT ad sessions generated roughly one third of the revenue per visit produced by Google paid search.
  answer: Search Engine Journal reviewed data where 84 out of 87 advertisers saw lower revenue per session from ChatGPT ads compared to traditional paid search.
  sources:
  - 'ChatGPT Ads Vs. Google Search Ads: What Early Data Shows via @sejournal, @MattGSouthern: https://www.searchenginejournal.com/chatgpt-ads-vs-google-search-ads-early-data/597125/'
