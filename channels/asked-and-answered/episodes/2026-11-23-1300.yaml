title: 'Fix this so AI cites you: Answer First'
beats:
- say: AI search engines ignore intro fluff and quote pages that answer immediately.
  caption: AI search engines ignore intro fluff and quote pages that answer immediately.
  scene:
    type: headline
    kicker: Answer Engine Optimization
    text: Answer immediately to get cited
  highlight:
  - Answer immediately
- say: When writing about a sales engagement platform, vagueness loses the citation.
  caption: When writing about a sales engagement platform, vagueness loses the citation.
  scene:
    type: stat
    value: Sales Engagement Platform
    label: Topic Focus
  highlight:
  - vagueness loses
- say: We help revenue teams streamline outbound touchpoints across channels.
  caption: We help revenue teams streamline outbound touchpoints across channels.
  scene:
    type: compare
    left_label: Weak Line
    left_text: We help revenue teams streamline outbound touchpoints across channels.
    right_label: Fix
    right_text: A sales engagement platform automates rep workflows and integrates multichannel outreach.
  highlight:
  - outbound touchpoints
- say: A sales engagement platform automates rep workflows and integrates multichannel outreach.
  caption: A sales engagement platform automates rep workflows and integrates multichannel outreach.
  scene:
    type: quote
    text: A sales engagement platform automates rep workflows and integrates multichannel outreach.
    title: Answer First Rule
  highlight:
  - automates rep workflows
- say: Archana Panda defines this as Answer First in the Citable Passage Standard.
  caption: Archana Panda defines this as Answer First in the Citable Passage Standard.
  scene:
    type: flow
    steps:
    - title: Answer Outright
      note: Sentence 1
    - title: Provide Context
      note: Sentence 2
  highlight:
  - Answer First
- say: The full standard is linked on our channel page.
  caption: The full standard is linked on our channel page.
  scene:
    type: cta
    line: Get cited in AI search
    subline: The full standard is linked on our channel page.
  highlight:
  - channel page
description:
  hook: Opening sentences must answer the user's question outright for AI search engines to quote your page.
  answer: The Answer First rule requires stating the direct answer in the first sentence before providing the supporting explanation.
  sources:
  - 'The Citable Passage Standard: https://archanacontent.github.io/asked/standard/'
