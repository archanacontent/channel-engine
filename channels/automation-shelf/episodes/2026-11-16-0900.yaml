    \   \n\n            \n                \n\nManually checking job boards to find growing companies and potential leads takes up valuable time. \n\nBy leveraging n8n, Bright Data, and OpenAI, you can automate this entire process.\n\nThis guide will walk you through a **fully automated n8n workflow** that:\n* Scrapes job listings from **Indeed** and other platforms.\n* Uses **Bright Data** to bypass anti-scraping protections.\n* Uses **AI (OpenAI)** to parse job details, extract company information, and evaluate growth indicators.\n* Sends **formatted email alerts** directly to your team.\n\nFollow this step-by-step guide to set up the workflow and start generating leads on autopilot.\n\n---\n\n## **Prerequisites**\nBefore you begin, ensure you have the following:\n1. **n8n Instance** – Self-hosted or Cloud.\n2. **Bright Data Account** – For Web Unlocker / Scraping Browser.\n3. **OpenAI API Key** – For AI-powered data extraction.\n4. **Gmail Account** – For sending automated email alerts.\n\
    5. **The Workflow JSON File** – Download it from [Nofluff.online](https://www.nofluff.online/tools).\n\n---\n\n## **Step 1: Import the n8n Workflow**\n1. Open your **n8n dashboard**.\n2. Click on **Workflows > Import from File**.\n3. Select the `.json` file you downloaded from Nofluff.online.\n4. Your workflow canvas should now display the full automation.\n\n---\n\n## **Step 2: Configure the Trigger Node**\n* **Node:** `Schedule Trigger`\n* **Purpose:** Determines when the workflow runs.\n* **Setup:**\n  * Set the trigger to run **daily, weekly, or at custom intervals** depending on how frequently you want to scan for new job posts.\n\n---\n\n## **Step 3: Set Up Bright Data for Scraping**\n* **Node:** `mcpClientTool` (Bright Data Integration)\n* **Purpose:** Bypasses CAPTCHAs and IP blocks on job sites like Indeed.\n* **Setup:**\n  1. Sign in to **Bright Data** and navigate to **Web Scraper API** or **Web Unlocker**.\n  2. Copy your **API Key**.\n  3. In n8n, open the `mcpClientTool`\
    \ node and enter your Bright Data credentials.\n  4. Set the target URL (e.g., `https://www.indeed.com/jobs?q=marketing`).\n\n---\n\n## **Step 4: Configure OpenAI for Data Extraction**\n* **Nodes:** `agent`, `lmChatOpenAi`, `outputParserStructured`, `outputParserAutofixing`\n* **Purpose:** Analyzes the raw HTML/text and extracts structured lead data.\n* **Setup:**\n  1. Go to **OpenAI Platform** and generate an API key.\n  2. In n8n, add your **OpenAI API Key** to the `lmChatOpenAi` node.\n  3. Configure the `agent` node with a prompt such as:\n     > \"Extract company name, job title, location, salary, and company growth indicators from the provided job listing.\"\n  4. Ensure `outputParserStructured` enforces a clean JSON format for easy downstream use.\n\n---\n\n## **Step 5: Process and Filter the Data**\n* **Nodes:** `set`, `code`, `memoryBufferWindow`\n* **Purpose:** Cleans the data, avoids duplicate alerts, and formats the output.\n* **Setup:**\n  1. Use the `code` node to filter\
    \ results (e.g., only keep listings with specific keywords like \"Hiring Fast\" or \"Manager\").\n  2. The `memoryBufferWindow` keeps track of previously scraped jobs to avoid sending duplicate alerts.\n\n---\n\n## **Step 6: Configure Gmail Notification Alerts**\n* **Node:** `gmail`\n* **Purpose:** Sends an email digest to your sales or marketing team with the new leads.\n* **Setup:**\n  1. Authenticate your **Gmail Account** in n8n (via OAuth2).\n  2. Set the **To Email** (your team’s inbox).\n  3. Customize the **Subject** line: `New Lead Alert: [Company Name] is Hiring!`\n  4. Format the **Body** using the parsed variables from OpenAI:\n     * **Company:** `{{ $json.company }}`\n     * **Job Title:** `{{ $json.title }}`\n     * **Growth Indicators:** `{{ $json.growth_signals }}`\n     * **Link:** `{{ $json.job_url }}`\n\n---\n\n## **Step 7: Test and Activate the Workflow**\n1. Click **Execute Workflow** to run a test.\n2. Check the output in the **Gmail node** to confirm you receive\
    \ a properly formatted email.\n3. Turn the workflow **ON** to run automatically based on your schedule.\n\n---\n\n## **Key Benefits of This Automation**\n* **Zero Manual Effort:** Runs in the background without human intervention.\n* **Unrestricted Scraping:** Bright Data handles IP blocks and CAPTCHAs seamlessly.\n* **AI-Powered Insights:** Extracts structured data rather than raw, messy text.\n* **Instant Lead Delivery:** Sends high-intent leads straight to your inbox.\n\n---\n\n## **Conclusion**\nBy combining **n8n, Bright Data, and OpenAI**, you now have a fully automated system to discover growing companies before your competitors do.\n\n\U0001F449 **Download the free workflow JSON file here:** [Nofluff.online/tools](https://www.nofluff.online/tools)\n\n---\n*Need help customizing this workflow for your business? Contact us at [Nofluff.online](https://www.nofluff.online).* \n\n            \n\n            \n                \n                    \n                        \n      \
