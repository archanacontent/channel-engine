name: Marketing Automation Library
slug: automation-shelf
positioning: Stop paying your team to do work a workflow can run.
description: >-
  Lead routing, content tracking, report pulls and follow-up reminders still eat hours in most marketing teams, because nobody has time to build the automation. Marketing Automation Library hands you the build. Each video breaks down one marketing task and the exact n8n workflow behind it, with a free template you can import the same day. Only tasks that can be fully automated make the library, and every template is validated before release.
palette:
  background: "#111827"
  accent: "#14B8A6"
  line: "#CCFBF1"
  text: "#FFFFFF"
  muted_text: "#9CA3AF"
fonts:
  headline: { file: "Manrope[wght].ttf", weight: 800 }
  label: { file: "JetBrainsMono[wght].ttf", weight: 500 }
  caption: { file: "Manrope[wght].ttf", weight: 700 }
voice: { model: kokoro-82m, voice: af_bella, speed: 1.08, lang: en-us }
music: { source: pixabay, mood: [upbeat electronic, motivational tech], pool_size: 10, gain_db: -24 }
captions:
  size: 62
  text: "#FFFFFF"
  highlight: "#14B8A6"
  style: underline
series:
  - { slot: "09:00", name: Stop Doing This, source: n8n-library }
  - { slot: "13:00", name: Library Pick, source: n8n-library }
  - { slot: "18:00", name: "Can It Be Automated?", source: n8n-library }
quality_gate: Every workflow passes the n8n workflow validator before it reaches the review queue.
titles:
  Stop Doing This: "Stop doing this by hand: {task}"
  Library Pick: "Free workflow: {task} on autopilot"
  "Can It Be Automated?": "Can you automate {task}?"
