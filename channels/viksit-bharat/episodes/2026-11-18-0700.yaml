description:
  summary: India's horticulture output is expected to reach a record 386.92 million tonne in 2025-26.
  details: Government third advance estimates released on November 17, 2026, show India's horticultural production is projected to rise 4.36 percent to 386.92 million tonne for the 2025-26 crop year. Agriculture Minister Shivraj Singh Chouhan noted the increase occurs even as the total cultivation area shrinks to 29.72 million hectares. Vegetable output is forecast at 227.27 million tonne and fruit production at 123.07 million tonne.
  key_figures: 'Horticulture output: 386.92 million tonne

    Vegetable output: 227.27 million tonne

    Fruit production: 123.07 million tonne

    Cultivation area: 29.72 million hectares'
