description:
  summary: India's economic activity remained resilient in October, supported by strong consumption and exports.
  details: The Reserve Bank of India's November bulletin reports that high-frequency indicators point to healthy economic activity. October saw the second-highest monthly GST revenue since the tax was introduced in 2017. This resilience persists despite global geopolitical tensions and energy price volatility.
