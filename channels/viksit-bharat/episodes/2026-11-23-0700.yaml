description:
  summary: Moody's raised India's FY27 growth forecast to 7% due to strong economic momentum.
  details: Moody's Ratings released its Global Macro Outlook 2027-28 on November 11, 2026. The agency increased the FY27 growth forecast to 7% from 6.5%. This revision is supported by robust consumption, improving investment trends, and resilience to energy supply shocks. The agency noted that India's large refining capacity helped contain fuel supply disruptions.
