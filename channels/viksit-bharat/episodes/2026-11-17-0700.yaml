description:
  summary: India's coconut sector supports 30 million livelihoods, including 10 million farmers.
  details: At the 62nd ICC Session on November 17, 2026, India called for stronger international cooperation to boost the global coconut sector. The Ministry of Agriculture and Farmers Welfare emphasized research, climate-resilient farming, and market expansion. The event aims to address common challenges and promote sustainable growth among coconut-producing nations.
