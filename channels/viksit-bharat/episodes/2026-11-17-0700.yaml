description:
  summary: State capital expenditure growth reached 14% in FY27, outpacing the Centre's 13% growth.
  details: An ICICI Securities report shows state governments are emerging as a new engine of capital expenditure. State capex growth for FY27 so far stands at 14%, compared to 13% for the central government. This trend is supported by state tax revenue growth of 14%, significantly higher than the Centre's 6%.
