description:
  summary: India's LPG production hit a record 9.2 million tonnes between April and October 2026.
  details: According to the Petroleum Planning and Analysis Cell, India's average daily LPG production rose 24 per cent year on year to 43,333 tonnes. This record output occurred as the closure of the Strait of Hormuz impacted global energy trade. The production supports approximately 32.64 crore households across the country.
  key_figures:
  - 'Total LPG Production: 9.2 million tonnes'
  - 'Average Daily Production: 43,333 tonnes'
  - 'Year on Year Production Increase: 24 per cent'
  - 'Total Households Using LPG: 32.64 crore'
