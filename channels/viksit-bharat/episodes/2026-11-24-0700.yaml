description:
  summary: India's GDP growth is expected to hold around 7 percent according to the Amundi Investment Institute.
  details: The Amundi Investment Institute 2027 Investment Outlook released this month projects strong domestic demand and infrastructure spending will support the economy. Growth is expected to hold around 7 percent despite challenges from inflation and energy prices. The report also highlights India's role as a connector economy in global trade flows.
