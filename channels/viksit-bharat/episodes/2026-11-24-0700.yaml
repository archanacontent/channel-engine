description:
  summary: India's residential rooftop solar has reached almost 57 lakh operational units.
  details: 'The Ministry of New and Renewable Energy reported that the PM Surya Ghar: Muft Bijli Yojana has added more than 19 GW of capacity. Gujarat, Maharashtra, and Uttar Pradesh account for over 51.11 per cent of the total capacity. Kerala leads in generation density with the highest yield per roof among major states.'
  key_figures: 'Total Capacity: 19,744.31 MW

    Gujarat Capacity: 3,523.98 MW

    Maharashtra Capacity: 3,336.54 MW

    Uttar Pradesh Capacity: 3,231.59 MW

    Kerala Yield: 3.87 kW per setup'
