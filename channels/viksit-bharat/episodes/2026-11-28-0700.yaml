description:
  summary: The new Saryu Kamala Express connects Ayodhya to Janakpur Dham via rail.
  details: India and Nepal have launched the Saryu Kamala Express, a weekly train service. The route covers 604 kilometres between Ayodhya Cantt and Janakpur Dham. This service aims to boost religious tourism and strengthen the Ramayan Circuit. The launch was coordinated by Prime Ministers Narendra Modi and Balendra Shah.
