description:
  summary: Strong demand from blenders lifted CTC dust prices at Kochi tea auctions, with average prices rising by 2 rupees per kg.
  details: BusinessLine reported on November 27, 2026, that blenders absorbed 70 per cent of the 6,44,260 kg offered in Sale 48 at the Kochi auctions. Good-liquoring teas were firm to dearer by 2 to 3 rupees per kg, while medium and plainer varieties remained steady to dearer. Anil George Joseph of the Tea Trade Association of Cochin noted that demand remained strong with prices generally firm to dearer.
  key_figures: 'Sale quantity: 6,44,260 kg

    Blender absorption: 70 per cent

    Average price increase: 2 rupees per kg

    Good-liquoring tea increase: 2 to 3 rupees per kg'
