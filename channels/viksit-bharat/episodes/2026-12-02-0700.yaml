description:
  summary: India’s unincorporated businesses recorded their fastest quarterly growth in the July-September period.
  details: The National Statistics Office reports that the number of unincorporated establishments rose by 18.81 per cent to 9.47 crore. Total employment in the sector increased by 16.86 per cent to 15.03 crore. The expansion is primarily driven by self-employment, with working owners now making up nearly 62 per cent of the total workforce.
  key_figures: 'Establishments: 9.47 crore. Employment: 15.03 crore. Working owners share: 61.99 per cent.'
