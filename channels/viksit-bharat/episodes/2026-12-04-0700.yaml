description:
  summary: India's economic activity growth reached a four year high of 9% in October.
  details: A report by Jefferies released on November 24, 2026, shows India's economic activity growth hit 9% year on year in October. This surge was supported by strong industrial activity and a delayed festive season. Key indicators like electricity demand and bank credit growth also saw significant multi year highs.
