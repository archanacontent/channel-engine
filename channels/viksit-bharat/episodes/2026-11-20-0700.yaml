description:
  summary: Moody's raises India's FY27 growth forecast to 7%.
  details: Moody's Ratings has increased its growth forecast for India to 7% for the 2026-27 period. The agency cites resilient consumption and improving investment dynamics. This follows a similar upward revision by the World Bank. The report notes that India is expected to sustain this growth through 2028.
