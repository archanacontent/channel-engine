description:
  summary: India's exports to Africa grew by 44 percent, the fastest growth among major regions.
  details: Government data released on November 22, 2026, shows India's merchandise exports are gaining a wider geographical footprint. Exports to Africa rose 44 percent to USD 31.42 billion during April-September 2026-27. Shipments to Asia also crossed USD 100 billion, reaching USD 103.84 billion. The expansion is supported by demand for engineering, electronics, and petroleum products.
