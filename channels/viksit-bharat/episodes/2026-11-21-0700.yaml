description:
  summary: India has almost 57 lakh operational residential rooftop solar units.
  details: 'The Ministry of New and Renewable Energy reported that residential rooftop solar deployment has expanded significantly under the PM Surya Ghar: Muft Bijli Yojana. Gujarat, Maharashtra, and Uttar Pradesh together account for over 51.11 percent of the 19,744.31 MW total capacity. Central subsidies totaling 37,533 crore rupees have been disbursed to support this decentralised generation.'
  key_figures: 'Total Capacity: 19,744.31 MW

    Operational Units: 57 lakh

    Total Subsidies: ₹37,533 crore

    Gujarat Capacity: 3,523.98 MW'
