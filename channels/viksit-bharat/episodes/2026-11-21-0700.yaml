description:
  summary: India's economy is projected to grow by 7.6 percent in the July-September quarter.
  details: A Reuters poll of 43 economists predicts India's GDP grew 7.6 percent in the July-September quarter, the fastest pace among major economies. Resilient consumer demand and passenger vehicle sales helped mitigate inflationary pressures. While growth may moderate in the second half of the fiscal year, investment is expected to improve.
