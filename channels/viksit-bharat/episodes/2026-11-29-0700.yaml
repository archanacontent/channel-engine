description:
  summary: India's non-basmati rice exports surged 6.7% to 8.84 million tonnes in April-October 2026, official data shows.
  details: Official data released in November 2026 showed non-basmati rice exports reaching 8.84 million tonnes between April and October 2026. Shipments of non-basmati white rice grew 18.3 percent to 2.82 million tonnes, while broken rice exports jumped 73.5 percent to 0.98 million tonnes. Competitive pricing from Indian exporters drove higher overseas demand for white and broken cereal varieties.
  key_figures: 'Non-basmati rice exports: 8.84 million tonnes (+6.7%)

    Non-basmati white rice: 2.82 million tonnes (+18.3%)

    Broken rice shipments: 0.98 million tonnes (+73.5%)'
