description:
  summary: India launches its first indigenous H5N1 vaccine to protect poultry from bird flu.
  details: The Union Agriculture Ministry has introduced an indigenous vaccine for H5N1 avian influenza. Developed by the ICAR-National Institute of High Security Animal Diseases in Bhopal, this vaccine aims to curb the high mortality rates associated with bird flu outbreaks. It marks a step toward self-reliance in animal health protection.
