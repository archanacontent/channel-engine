name: Space Science
slug: deep-field
positioning: Discover space through real images, explained every day.
description: >-
  Most space pictures reach your feed with no context. You see a galaxy, a planet or a nebula, but not what it is, how far away it sits or why it matters. Space Science fixes that. Every day you get real images of planets, stars and galaxies, explained in plain words in under a minute, so each picture finally makes sense.
palette:
  background: "#070B1A"
  accent: "#7C5CFF"
  highlight: "#FF8A3D"
  text: "#F8FAFC"
  muted_text: "#A7B0C8"
fonts:
  headline: { file: "Sora[wght].ttf", weight: 600 }
  caption: { file: "Inter[opsz,wght].ttf", weight: 600 }
voice: { model: kokoro-82m, voice: bm_george, speed: 0.97, lang: en-gb }
music: { source: pixabay, mood: [ambient space, cinematic calm], pool_size: 10, gain_db: -24 }
captions:
  size: 62
  text: "#F8FAFC"
  numbers: "#FF8A3D"
  shadow: true
series:
  - { slot: "09:00", name: Look Closer, source: images.nasa.gov }
  - { slot: "13:00", name: Mission Log, source: NASA mission news }
  - { slot: "18:00", name: Scale It, source: NASA fact pages, drawn as vector graphics }
media_filters:
  - Skip any file whose credit names a party other than NASA.
  - Never show the NASA insignia or logotype.
  - Skip shots where an identifiable person is the subject.
titles:
  Look Closer: "What you're looking at: {object}"
  Mission Log: "{mission}: what just happened"
  Scale It: "How big is {object}, really?"
description_template: |
  {explainer}
  Credit: {credit}
  Source: {source_link}

  Sources:
  {source_links}

  {youtube_hashtags}
hashtags:
  youtube: ["#SpaceScience", "#Space", "#Astronomy"]
  instagram_anchors: ["#SpaceScience", "#Space"]
  instagram_rotation: ["#Astronomy", "#NASA", "#Universe", "#Planets", "#Cosmos", "#ScienceFacts"]
handle: "@SPACESCIENCE101"
seo:
  category_id: "28"
  tag_pool: [space, space science, astronomy, NASA, space facts]
  hashtag_pool: ['#SpaceScience', '#Space', '#Astronomy', '#NASA']
  playlists:
    "Look Closer": "Look Closer: Real Space Images Explained"
    "Mission Log": "Mission Log: Space Missions Explained"
    "Scale It": "Scale It: How Big Is It Really?"
  series_pools:
    "Look Closer": {tags: [space images, James Webb, Hubble, galaxy, nebula], hashtags: ['#JamesWebb', '#Hubble']}
    "Mission Log": {tags: [space news, NASA mission, space exploration], hashtags: ['#SpaceNews', '#NASA']}
    "Scale It": {tags: [solar system, planets, size comparison, scale of the universe], hashtags: ['#SolarSystem', '#Planets']}
