description:
  explainer: NASA's Curiosity Mars rover captured this 360-degree panorama of the Ubajara sampling site, where it discovered siderite hidden in sulfate-rich rocks. This iron carbonate mineral helps explain where the carbon dioxide from Mars' ancient, thick atmosphere went when liquid water flowed across its surface.
  sources:
  - 'NASA Image and Video Library: https://images.nasa.gov/details/PIA26554'
  credit: NASA
