series: Scale It
title: "How big is Jupiter, really?"
visuals: Drawn vector graphics, not NASA imagery. No altered-content disclosure needed.
beats:
  - say: "How big is Jupiter, really?"
    caption: "How big is Jupiter, really?"
    numbers: []
  - say: "NASA puts it at eleven times wider than Earth. Line up eleven Earths, and they span it edge to edge."
    caption: "NASA puts it at 11 times wider than Earth. Line up 11 Earths, and they span it edge to edge."
    numbers: ["11"]
  - say: "Make it hollow, and about a thousand Earths could fit inside."
    caption: "Make it hollow, and about 1,000 Earths could fit inside."
    numbers: ["1,000"]
  - say: "Shrink Earth to the size of a grape, and Jupiter becomes a basketball."
