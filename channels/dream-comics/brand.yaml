name: Classic Comics Alive
slug: dream-comics
format: comic
handle: ""
positioning: Century-old comics, voiced and brought to life every day.
end_line: A new classic comic, voiced, every day.
description: >-
  The funniest and strangest comics of the early 1900s were printed once, read on a Sunday morning and forgotten. Classic Comics Alive brings them back as voiced motion comics, panel by panel, with every character speaking their original lines. Daily episodes of Little Nemo in Slumberland, Little Sammy Sneeze and Dream of the Rarebit Fiend by Winsor McCay, all public domain.
