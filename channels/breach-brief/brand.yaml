name: Cybersecurity Daily
slug: breach-brief
positioning: The threats that matter this week, and the exact step that stops them.
description: >-
  New flaws come under active attack every week, companies disclose new breaches and fresh scams spread, and most people learn about them only after they've been hit. Cybersecurity Daily turns official sources into clear one-minute briefings: vulnerabilities attackers are exploiting right now from CISA's Known Exploited Vulnerabilities catalog, breaches as companies report them to the SEC, and scams flagged by the FTC. Every briefing names what's affected and the step that protects you, so IT teams, business owners and everyday users can act the same day.
palette:
  background: "#0B0F14"
  threat: "#E5484D"
  fix: "#3DD68C"
  secondary: "#8B949E"
  text: "#F0F3F6"
fonts:
  headline: { file: "IBMPlexSansCondensed-Bold.ttf" }
  caption: { file: "IBMPlexSansCondensed-SemiBold.ttf" }
  data: { file: "IBMPlexMono-Medium.ttf" }
voice: { model: kokoro-82m, voice: am_onyx, speed: 1.0, lang: en-us }
music: { source: pixabay, mood: [dark ambient, tension minimal], pool_size: 10, gain_db: -26 }
captions:
  size: 64
  text: "#F0F3F6"
  threat_words: "#E5484D"
  fix_words: "#3DD68C"
series:
  - { slot: "09:00", name: Exploited Today, source: cisa-kev + nvd + vendor advisory }
  - { slot: "13:00", name: Breach Watch, source: sec-edgar cyber incident filings }
  - { slot: "18:00", name: Scam Alert, source: ftc consumer alerts }
rules:
  - Never name a person as a victim or a suspect.
  - Breach Watch covers only what the company itself filed.
titles:
  Exploited Today: "Exploited now: {product} {cve}"
  Breach Watch: "{company} breach: what was taken"
  Scam Alert: "Scam alert: {scam}"
description_template: |
  {summary}
  Affected: {affected}
  What to do: {action}

  Sources:
  {source_links}

  Query the NVD yourself: https://github.com/archanacontent/nvd-cve-api-docs

  {youtube_hashtags}
hashtags:
  youtube_by_series:
    Exploited Today: ["#CybersecurityDaily", "#CyberSecurity", "#CVE"]
    Breach Watch: ["#CybersecurityDaily", "#CyberSecurity", "#DataBreach"]
    Scam Alert: ["#CybersecurityDaily", "#CyberSecurity", "#ScamAlert"]
  instagram_anchors: ["#CybersecurityDaily", "#CyberSecurity"]
  instagram_rotation: ["#InfoSec", "#DataBreach", "#ScamAlert", "#Phishing", "#PatchNow", "#OnlineSafety"]
handle: "@CybersecurityDailyHQ"
seo:
  category_id: "28"
  tag_pool: [cybersecurity, cybersecurity news, cyber security, infosec]
  hashtag_pool: ['#CybersecurityDaily', '#CyberSecurity', '#InfoSec']
  playlists:
    "Exploited Today": "Exploited Today: Actively Exploited Vulnerabilities"
    "Breach Watch": "Breach Watch: Company Data Breaches"
    "Scam Alert": "Scam Alert: Scams Going Around Now"
  series_pools:
    "Exploited Today": {tags: [CISA KEV, known exploited vulnerabilities, CVE, vulnerability, patch now, security update], hashtags: ['#CVE', '#PatchNow']}
    "Breach Watch": {tags: [data breach, data breach news, SEC 8-K, cyber incident], hashtags: ['#DataBreach', '#CyberIncident']}
    "Scam Alert": {tags: [scam alert, online scams, phishing, fraud prevention, online safety], hashtags: ['#ScamAlert', '#Phishing']}
