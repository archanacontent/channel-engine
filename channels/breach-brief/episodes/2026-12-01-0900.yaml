description:
  summary: Project MONAI MONAI Label contains an actively exploited path traversal vulnerability, tracked as CVE-2026-133968, allowing unauthenticated remote code execution.
  affected: MONAI Label versions prior to 0.8.6 are affected.
  action: Apply mitigations by updating to version 0.8.6 or later according to vendor instructions, follow B.O.D. 26-04 guidelines, or discontinue product use if unmitigated.
