description:
  summary: CISA added CVE-2026-0322 to its Known Exploited Vulnerabilities catalog following active exploitation of a code injection flaw in Palo Alto Networks PAN-OS. The flaw allows authenticated attackers to execute arbitrary code with root privileges.
  affected: Palo Alto Networks PAN-OS on PA-Series, VM-Series firewalls, and Panorama (virtual and M-Series). Cloud NGFW and Prisma Access are not impacted.
  action: Apply mitigations following vendor instructions and restrict management interface access strictly to trusted internal IP addresses.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
  - 'NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-0322'
