description:
  summary: Misleading advertisements and phone pitches are targeting people during health insurance open enrollment.
  affected: Consumers looking for health insurance plans via social media, search results, or phone calls.
  action: Only use HealthCare.gov or call 1-800-318-2596 to ensure you are accessing official Marketplace services.
  sources:
  - 'FTC consumer alert: https://consumer.ftc.gov/consumer-alerts/2026/10/seeing-lots-ads-health-insurance-plans-during-open-enrollment-read'
