- say: Scammers use ads or phone pitches to promise comprehensive coverage while offering limited benefits or medical discount cards instead.
  caption: Scammers use ads or phone pitches to promise comprehensive coverage while offering limited benefits or medical discount cards instead.
  highlight:
  - promise comprehensive coverage
  - offering limited benefits
  scene:
    type: compare
    left_label: The Promise
