  highlight:
  - warning signs
  scene:
    type: list
    title: Warning Signs
    items:
    - Ads impersonating government agencies
    - Illegal prerecorded robocalls
    - Social media or search scams
    - Plans with limited benefits
    style: bullet
- say: Verify official sites end in dot gov and use H T T P S for encryption.
  caption: Verify official sites end in .gov and use HTTPS for encryption.
  highlight:
  - end in .gov
  - use HTTPS
  scene:
    type: card
    title: Verification Steps
    rows:
    - - Domain
