- say: Protect your savings by looking for these warning signs.
  caption: Protect your savings by looking for these warning signs.
  highlight:
  - warning signs
  scene:
    type: headline
    text: Watch for these warning signs
- say: Check if earnings claims are in Item 19 of the F D D. Ask for written substantiation of all claims. Contact current and former franchisees to verify the facts.
  caption: Check if earnings claims are in Item 19 of the FDD. Ask for written substantiation of all claims. Contact current and former franchisees to verify the facts.
  highlight:
  - Item 19 of the FDD
  - written substantiation
  scene:
