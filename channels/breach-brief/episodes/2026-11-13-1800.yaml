title: 'Scam alert: franchise misrepresentation'
beats:
- say: Franchisors must provide honest information about costs and potential earnings.
  caption: Franchisors must provide honest information about costs and potential earnings.
  highlight:
  - honest information
  - potential earnings
  scene:
    type: headline
    text: Franchisors must provide honest information
- say: The F T C charged Premier Martial Arts for misrepresenting potential earnings. They claimed non martial artists could profitably run franchises working less than fifteen hours a week.
  caption: The FTC charged Premier Martial Arts for misrepresenting potential earnings. They claimed non-martial artists could profitably run franchises working less than 15 hours a week.
  highlight:
  - misrepresenting potential earnings
  - less than 15 hours
  scene:
    type: card
    title: Premier Martial Arts Case
    rows:
    - - Issue
