description:
  summary: Ahsay AhsayCBS contains an actively exploited command injection vulnerability tracked as CVE-2026-105134 with a 10.0 CVSS score. Attackers can remotely execute operating system commands by manipulating the random parameter in the Replication Receiver component.
  affected: Ahsay AhsayCBS versions up to 9.15.2.69 and 10.3.4.44 are affected.
  action: Upgrade affected installations to version 9.15.2.70 or 10.3.4.45 according to vendor instructions, or discontinue use if mitigations are unavailable.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
  - 'NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-105134'
