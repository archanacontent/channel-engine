  summary: CISA added a critical hard-coded credentials vulnerability in Cisco Expressway Series to its Known Exploited Vulnerabilities catalog.
  affected: Cisco Expressway Core (Expressway-C) and Cisco Expressway Edge (Expressway-E) devices.
