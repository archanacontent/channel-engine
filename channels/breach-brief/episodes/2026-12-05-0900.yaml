description:
  summary: CISA added an active OSGeo GeoServer XML injection flaw to the Known Exploited Vulnerabilities catalog. It allows attackers to read local files and can be chained to achieve remote code execution.
  affected: OSGeo GeoServer instances processing WFS 2.0 GetFeatureById stored queries.
  action: Apply mitigations per vendor instructions, follow CISA BOD 26-04 guidelines, or discontinue use of the product if mitigations are unavailable.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
  - 'NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-120705'
