description:
  summary: CISA has added CVE-2026-129243 in OSGeo GeoServer to its Known Exploited Vulnerabilities catalog due to active exploitation. An unauthenticated remote attacker can bypass service-level role checks using a prefixed service parameter, which can lead to unauthenticated remote code execution when chained with other vulnerabilities.
  affected: OSGeo GeoServer instances exposed to unauthenticated remote access.
  action: Apply vendor mitigations according to guidance, follow CISA BOD 26-04 instructions, or discontinue product use if mitigations are unavailable.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
  - 'NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-129243'
