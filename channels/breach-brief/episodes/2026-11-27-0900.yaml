description:
  summary: A critical remote code execution vulnerability in Synology DiskStation Manager and BeeStation OS is currently under active exploitation. CISA has added this flaw to its Known Exploited Vulnerabilities catalog with a mandatory remediation deadline.
  affected: Synology BeeStation OS before 1.1-65374 and Synology DiskStation Manager before 7.2-64570-4, 7.2.1-69057-6, and 7.2.2-72806-1.
  action: Apply the latest patches from Synology immediately or discontinue use of the device if updates cannot be applied.
