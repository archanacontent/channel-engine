description:
  summary: CVE-2026-76519 is a critical relative path traversal vulnerability in Cisco Secure Email Gateway. It allows remote attackers to write arbitrary files and execute commands with root privileges by sending crafted email attachments.
  affected: Cisco Secure Email Gateway devices using the Advanced Malware Protection (AMP) feature.
  action: Apply vendor mitigations, adhere to CISA Forensics Triage Requirements and BOD 26-04 guidance, or discontinue product use if mitigations are unavailable.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
  - 'NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-76519'
