description:
  summary: Collabora Online Built-in CODE Server contains a critical OS command injection vulnerability exploited in the wild.
  affected: Collabora Online Built-in CODE Server before 26.4.303 used within the Nextcloud platform.
  action: Update to version 26.4.303 or apply vendor mitigations following CISA BOD 26-04 guidance.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
  - 'NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-110447'
