- say: The simplest fix is to upgrade to Apache Roller 6.1.6 or later to disable these extension types.
  caption: The simplest fix is to upgrade to Apache Roller 6.1.6 or later to disable these extension types.
  highlight:
  - upgrade to Apache Roller 6.1.6
