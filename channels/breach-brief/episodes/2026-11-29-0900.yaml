- say: The XML R P C endpoint accepts and deserializes untrusted data before a user even logs in. This vulnerability affects Apache Roller versions 4.0.0 through 6.1.4.
  caption: The XML-RPC endpoint accepts and deserializes untrusted data before a user even logs in. This vulnerability affects Apache Roller versions 4.0.0 through 6.1.4.
  highlight:
  - deserializes untrusted data
  - before a user even logs in
  scene:
