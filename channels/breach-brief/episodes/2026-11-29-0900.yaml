description:
  summary: Apache Roller is being actively exploited via a critical deserialization flaw in its XML-RPC endpoint.
  affected: Apache Roller versions 4.0.0 through 6.1.4.
  action: Upgrade to version 6.1.6 or later, or manually disable extensions in web.xml and remove the XML-RPC servlet mapping.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
  - 'NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-129448'
