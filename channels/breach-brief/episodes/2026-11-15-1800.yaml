description:
  summary: Scammers are using social media profiles to impersonate the VA and promote fake investments.
  affected: Veterans using platforms like Facebook, Instagram, and TikTok.
  action: Verify all benefit offers through VA.gov and restrict your social media privacy settings.
  sources:
  - 'FTC consumer alert: https://consumer.ftc.gov/consumer-alerts/2026/11/veterans-day-reminder-how-spot-scams-social-media'
