description:
  summary: Check Point products are being exploited via a critical vulnerability in the Gaia OS DynamicCLI daemon. This flaw allows authenticated local users to execute commands with root privileges.
  affected: Check Point Firewall, Multi-Domain Security Management Server, Scalable Platforms, Security Gateway, and Security Management Server.
  action: Apply vendor mitigations immediately and evaluate internet exposure for all affected assets.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
