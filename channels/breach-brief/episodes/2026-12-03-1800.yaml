description:
  summary: Ivanti Connect Secure contains an authentication bypass by spoofing vulnerability (CVE-2026-104935) that allows a remote unauthenticated attacker to execute arbitrary commands.
  affected: This vulnerability impacts Ivanti Connect Secure versions prior to 25.1.3.0, but does not affect version 22.7R2.14 or prior.
  action: Apply mitigations according to vendor instructions and CISA BOD 26-04 guidance, evaluate internet exposure, or discontinue product use if mitigations are unavailable.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
  - 'NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-104935'
