description:
  summary: Broadcom VMware vCenter contains a critical authentication bypass vulnerability (CVE-2026-123890) in the VMware Directory Service that allows attackers to gain unauthorized access.
  affected: Broadcom VMware vCenter versions 9.1.x, 9.0.x, 8.0, 5.x, as well as Telco Cloud Platform and Infrastructure versions.
  action: Apply vendor mitigations immediately, follow CISA BOD 26-04 guidance and forensics triage requirements, or discontinue product use if mitigations are unavailable.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
  - 'NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-123890'
