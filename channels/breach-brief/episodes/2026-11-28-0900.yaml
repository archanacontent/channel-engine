description:
  summary: CISA added CVE-2026-90436 in Apache Axis 1.x to its Known Exploited Vulnerabilities catalog. It allows unauthenticated remote attackers to execute arbitrary code via a crafted SOAP fault message.
  affected: All Apache Axis 1.x versions through 1.4 are affected.
  action: Migrate to a supported SOAP engine such as Apache Axis 2, apply official patches, or discontinue use of the unsupported product.
  sources:
  - 'CISA KEV catalog: https://www.cisa.gov/known-exploited-vulnerabilities-catalog'
  - 'NVD: https://nvd.nist.gov/vuln/detail/CVE-2026-90436'
