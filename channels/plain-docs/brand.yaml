name: Technical Writing For Beginners
slug: plain-docs
positioning: Write documentation people actually finish reading.
description: >-
  Unclear docs turn into support tickets, stalled onboarding and features nobody uses. Most new writers learn the craft from rule lists that never show the work. Technical Writing For Beginners teaches it on real material: a confusing README, a vague error message or a cluttered help page, rewritten edit by edit with the reason behind each change. Made for aspiring technical writers, developers who own their docs and professionals moving into technical writing.
palette:
  background: "#FBF8F1"
  text: "#1F2937"
  edit: "#D7263D"
  highlight: "#FFE066"
  muted_text: "#6B7280"
fonts:
  headline: { file: "SourceSerif4[opsz,wght].ttf", weight: 600 }
  body: { file: "SourceSans3[wght].ttf", weight: 400 }
  caption: { file: "SourceSans3[wght].ttf", weight: 700 }
voice: { model: kokoro-82m, voice: af_heart, speed: 1.03, lang: en-us }
music: { source: pixabay, mood: [soft piano, calm acoustic], pool_size: 10, gain_db: -28 }
captions:
  size: 62
  text: "#1F2937"
  highlight: "#FFE066"
  pill: { color: "#FFFFFF", opacity: 0.85 }
series:
  - { slot: "09:00", name: Rewrite This, source: public docs with open licenses }
  - { slot: "13:00", name: One Rule, source: published style guides }
  - { slot: "18:00", name: Doc Types, source: published style guides }
titles:
  Rewrite This: "Fixing a real {doc_kind} in under a minute"
  One Rule: "Writing rule: {rule}"
  Doc Types: "What a {doc_type} must include"
description_template: |
  {what_was_fixed}
  Original: {source_link} ({license})
  The rule: {rule}
  Worked examples and guides: https://archanacontent.github.io/work/

  {youtube_hashtags}
hashtags:
  youtube: ["#TechnicalWritingForBeginners", "#TechnicalWriting", "#Documentation"]
  instagram_anchors: ["#TechnicalWritingForBeginners", "#TechnicalWriting"]
  instagram_rotation: ["#WritingTips", "#Documentation", "#DevDocs", "#CareerChange", "#UXWriting", "#TechCareers"]
handle: "@TECHNICALWRITINGFORBEGINNERS"
seo:
  category_id: "27"
  tag_pool: [technical writing, technical writing for beginners, technical writer, documentation, how to write documentation]
  hashtag_pool: ['#TechnicalWritingForBeginners', '#TechnicalWriting', '#Documentation', '#TechWriter']
  playlists:
    "Rewrite This": "Rewrite This: Real Docs Fixed"
    "One Rule": "One Rule: Technical Writing Rules"
    "Doc Types": "Doc Types: What Every Doc Needs"
  series_pools:
    "Rewrite This": {tags: [writing tips, UX writing, before and after, editing], hashtags: ['#WritingTips', '#UXWriting']}
    "One Rule": {tags: [writing tips, style guide, clear writing], hashtags: ['#WritingTips', '#StyleGuide']}
    "Doc Types": {tags: [README, API documentation, release notes, docs as code], hashtags: ['#DevDocs', '#README']}
