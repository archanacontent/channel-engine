- say: Good documentation explains how to run the code. Include setup instructions, dependencies, and expected outputs.
  caption: Good documentation explains how to run the code. Include setup instructions, dependencies, and expected outputs.
  scene:
    type: list
    title: What to include
    items:
    - The essential elements for running sample code documentation include setup, dependencies, and outputs.
  highlight:
  - setup instructions
  - dependencies
  - expected outputs
- say: Do not reuse unit tests as sample programs. Unit tests aim to test, while sample code aims to educate.
  caption: Do not reuse unit tests as sample programs. Unit tests aim to test, while sample code aims to educate.
  scene:
    type: headline
    text: Separate unit tests from sample code
  highlight:
  - reuse unit tests
  - aims to educate
- say: Sample code should be short.
  caption: Sample code should be short.
  scene:
    type: quote
    text: Sample code should be short.
    value: Conciseness is the final rule for effective sample code.
