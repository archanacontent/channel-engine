title: What a code sample must include
beats:
- say: Programmers prefer good code over clear text. Text and code are different languages.
  caption: Programmers prefer good code over clear text. Text and code are different languages.
  scene:
    type: headline
    text: Programmers prefer good code over clear text
  highlight:
  - good code
  - clear text
- say: Treat samples like production code. They must build without errors, be secure, and follow language conventions.
  caption: Treat samples like production code. They must build without errors, be secure, and follow language conventions.
  scene:
