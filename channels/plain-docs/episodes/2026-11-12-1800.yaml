title: What a changelog must include
beats:
- say: Never dump raw git logs into your changelog files.
  caption: Never dump raw git logs into your changelog files.
  highlight:
  - Never dump raw git logs
  scene:
    type: headline
    text: Stop dumping git logs into changelogs
- say: A changelog documents all notable changes to a project. It should follow Semantic Versioning to maintain structure.
  caption: A changelog documents all notable changes to a project. It should follow Semantic Versioning to maintain structure.
  highlight:
  - notable changes
  - Semantic Versioning
  scene:
    type: card
    title: Changelog Purpose
    rows:
    - - Goal
      - Document notable changes
    - - Standard
      - Semantic Versioning
- say: Every entry needs specific categories. Use Added for new features, Fixed for bug repairs, Changed for updates, and Removed for deletions.
  caption: Every entry needs specific categories. Use Added for new features, Fixed for bug repairs, Changed for updates, and Removed for deletions.
  highlight:
  - specific categories
  scene:
    type: list
    title: Required Categories
    items:
    - Added
    - Fixed
    - Changed
    - Removed
    style: check
- say: For example, version 1.1.1 added Arabic, French, and Russian translations. It also fixed missing periods and broken links.
  caption: For example, version 1.1.1 added Arabic, French, and Russian translations. It also fixed missing periods and broken links.
  highlight:
  - version 1.1.1
  - added Arabic, French, and Russian
  scene:
