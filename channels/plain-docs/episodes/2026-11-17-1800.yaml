    items:
    - Unactionable
    - Inaccurate
    - Confusing
    - Unknown cause
    style: bullet
- say: Effective messages reduce support burdens by enabling user self help. They enable faster resolution of issues.
  caption: Effective messages reduce support burdens by enabling user self help. They enable faster resolution of issues.
