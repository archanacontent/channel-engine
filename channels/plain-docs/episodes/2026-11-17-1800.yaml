  - answer two questions
  scene:
    type: headline
    text: Answer two essential questions
- say: A useful message explains exactly what went wrong and how the user fixes that problem.
  caption: A useful message explains exactly what went wrong and how the user fixes that problem.
  highlight:
  - what went wrong
  - how the user fixes
  scene:
