title: Fixing a real README in under a minute
beats:
- say: Vague instructions lead to support tickets and stalled onboarding.
  caption: Vague instructions lead to support tickets and stalled onboarding.
  highlight:
  - Vague instructions
  - stalled onboarding
  scene:
    type: headline
    text: Bad docs kill adoption
- say: The Phosphene README says, Turn a prompt or a picture into a clip whose picture and sound are generated together, using the M L X port of Lightricks' L T X 2.5.
  caption: The Phosphene README says, "Turn a prompt or a picture into a clip whose picture and sound are generated together, using the MLX port of Lightricks' LTX-2.5."
  highlight:
  - Turn a prompt or a picture into a clip
  scene:
    type: compare
    left_label: Original
    left_text: Turn a prompt or a picture into a clip whose picture and sound are generated together, using the MLX port of Lightricks' LTX-2.5.
    right_label: Rewrite
    right_text: Use the MLX port of LTX-2.5 to generate video clips with synchronized sound from text or images.
- say: The original uses a wordy relative clause. The rewrite uses active verbs.
  caption: The original uses a wordy relative clause. The rewrite uses active verbs.
  highlight:
  - wordy relative clause
  - active verbs
  scene:
    type: list
    title: Why it is better
    items:
    - Uses active verbs
    - Removes wordy clauses
    - States the method first
    style: check
- say: Specific verbs move the reader faster than descriptive filler.
  caption: Specific verbs move the reader faster than descriptive filler.
  highlight:
  - Specific verbs
  - descriptive filler
  scene:
    type: quote
    text: Use specific verbs to drive action.
    highlight:
    - specific verbs
