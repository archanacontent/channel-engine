skip: false
title: Fixing a real README in under a minute
beats:
- say: Vague notes waste time. Let us fix a confusing line in the Sendspin Zero readme.
  caption: Vague notes waste time. Let us fix a confusing line in the Sendspin Zero readme.
  scene:
    type: headline
    text: Fixing a Sendspin Zero Readme Line
  highlight:
  - Sendspin Zero
- say: 'This line is messy and conversational: NOTE: This is a DIY project, those that prefer Off-the-shelf devicea you can buy and use right away, there is a project for that here'
  caption: 'NOTE: This is a DIY project, those that prefer Off-the-shelf devicea you can buy and use right away, there is a project for that here'
  scene:
    type: compare
    left_label: Weak
    left_text: 'NOTE: This is a DIY project, those that prefer Off-the-shelf devicea you can buy and use right away, there is a project for that here:'
    right_label: Clear
    right_text: For ready made devices, use the alternative project.
  highlight:
  - DIY project
- say: We remove the typo and the run on phrasing. Direct instructions keep readers moving.
  caption: We remove the typo and the run on phrasing. Direct instructions keep readers moving.
  scene:
    type: list
    items:
    - Remove typos
    - Cut conversational filler
    - State direct alternatives
    style: check
    title: Editing Steps
  highlight: []
- say: Write documentation people actually finish reading.
  caption: Write documentation people actually finish reading.
  scene:
    type: quote
    highlight:
    - finish reading
    text: Write documentation people actually finish reading.
  highlight:
  - finish reading
description:
  what_was_fixed: Rewrote a run on sentence about off the shelf alternatives to remove typos and conversational clutter.
  rule: Keep documentation direct and free of conversational filler.
  sources:
  - 'RealDeco/SendspinZero README (MIT): https://github.com/RealDeco/SendspinZero'
  source_link: https://github.com/RealDeco/SendspinZero
