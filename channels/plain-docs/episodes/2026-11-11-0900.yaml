skip: false
title: Fixing a real README in under a minute
beats:
- say: Vague README prose frustrates developers and stalls onboarding. We are fixing a real project description from Web Check O S I N T.
  caption: Vague README prose frustrates developers and stalls onboarding. We are fixing a real project description from Web Check-OSINT.
  scene:
    type: headline
    kicker: Rewrite This
    text: Fixing a real README
  highlight:
  - Vague README prose
  - Web Check-OSINT
- say: Here is the exact original sentence from the README. Get an insight into the inner-workings of a given website, uncover potential attack vectors, analyse server architecture, view security configurations, and learn what technologies a site is using.
  caption: 'Get an insight into the inner-workings of a given website: uncover potential attack vectors, analyse server architecture, view security configurations, and learn what technologies a site is using.'
  scene:
    type: compare
    left_label: Original
    left_text: 'Get an insight into the inner-workings of a given website: uncover potential attack vectors, analyse server architecture, view security configurations, and learn what technologies a site is using.'
    right_label: Better
    right_text: Analyze server architecture and security configurations for any website.
  highlight:
  - Get an insight into the inner-workings
- say: The original text buries the core action behind four generic clauses. We remove the clutter and focus on direct technical verbs.
  caption: The original text buries the core action behind four generic clauses. We remove the clutter and focus on direct technical verbs.
  scene:
    type: list
    title: Edit Steps
    unit: ''
    items:
    - 3 steps to clarity
  highlight:
  - direct technical verbs
- say: Clear documentation states capabilities directly without filler phrases. Put the main action in the first five words of every feature description.
  caption: Clear documentation states capabilities directly without filler phrases. Put the main action in the first five words of every feature description.
  scene:
    type: quote
    text: Put the main action in the first five words of every feature description.
    value: Rule
  highlight:
  - first five words
description:
  what_was_fixed: We rewrote a wordy feature introduction in the Web Check-OSINT README to state server analysis capabilities directly.
  rule: Put the main action in the first five words of every feature description.
  sources:
  - 'mwakidenis/WebCheck-OSINT README (MIT): https://github.com/mwakidenis/WebCheck-OSINT'
  source_link: https://github.com/mwakidenis/WebCheck-OSINT
  license: MIT
