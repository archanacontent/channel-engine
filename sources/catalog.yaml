citable_rules:
  - id: answer-first
    name: Answer First
    rule: The opening sentence answers the question outright, and the explanation follows it.
  - id: stand-alone
    name: Stand Alone
    rule: The passage makes sense without the rest of the page, so phrases like "as mentioned above" never appear.
  - id: name-the-subject
    name: Name The Subject
    rule: The product, standard or concept is named in full instead of being called "it" or "this".
  - id: be-specific
    name: Be Specific
    rule: Numbers, dates, named standards and named tools replace general claims wherever they can.
  - id: source-the-facts
    name: Source The Facts
    rule: Every figure links to where it came from, so readers and answer engines can both verify it.
  - id: one-question
    name: One Question Per Section
    rule: Each section answers a single question fully, so it can be cited without dragging in anything unrelated.

